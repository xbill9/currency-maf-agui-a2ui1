[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "currency-agent"
version = "0.1.0"
description = "Microsoft Agent Framework currency agent on Azure OpenAI, answering in A2UI 1.0 over AG-UI"
requires-python = ">=3.12"
dependencies = [
    "a2ui-agent-sdk == 0.11.0",
    "a2ui-core == 0.6.0",
    "agent-framework-core >= 1.25.0, < 2.0.0",
    "agent-framework-ag-ui >= 1.8.0, < 2.0.0",
    "agent-framework-openai >= 1.18.1, < 2.0.0",
    "azure-identity >= 1.25.3, < 2.0.0",
    "aiohttp >= 3.10",
    "fastapi >= 0.138.0, < 1.0.0",
    "fastmcp >= 4.1.8, < 5.0.0",
    "httpx >= 0.28.1",
    "mcp >= 2.3.0, < 2.4.0",
    "uvicorn >= 0.34.3, < 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
